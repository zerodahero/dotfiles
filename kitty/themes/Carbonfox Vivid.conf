# vim:ft=kitty
## name: Carbonfox Vivid
## author: EdenEast (Carbonfox), adjusted locally
## license: MIT
## upstream: https://github.com/EdenEast/nightfox.nvim/blob/main/extra/carbonfox/kitty.conf
## blurb: Carbonfox with lighter, more saturated ANSI colors.

#: Carbonfox keeps its background and hues. Its ANSI colors all sit at about
#: the same OKLCH lightness (0.67-0.75), so they read as flat pastels. Here each
#: color is lifted to Snazzy-like lightness and pushed to the most saturation
#: sRGB allows at that lightness. Two hues also move:
#:   - yellow: tan (hue 84) -> true yellow (hue 95)
#:   - cyan:   blue (hue 242) -> real cyan (hue 215), so it no longer
#:             looks like a second blue
#: Every color is at least 6:1 contrast against the background.

#: The basic colors

foreground                      #f6f7f9
background                      #161616
selection_foreground            #f6f7f9
selection_background            #3a3a3a


#: Cursor colors

cursor                          #f6f7f9
cursor_text_color               #161616


#: URL underline color when hovering with mouse

url_color                       #09e97f


#: kitty window border colors and terminal bell colors

active_border_color             #6aa0ff
inactive_border_color           #535353
bell_border_color               #4cdfff


#: Tab bar colors

active_tab_foreground           #0c0c0c
active_tab_background           #6aa0ff
inactive_tab_foreground         #8a8b8c
inactive_tab_background         #2a2a2a


