# ---------------------------------------------------------------------------
# macOS imperative tail.
#
# The `final` phase, not post-dotfiles, so it cannot collide with the base
# config's post-dotfiles hook regardless of how same-phase hooks merge.
#
# Runs on EVERY `mise bootstrap`, so every line must be idempotent.
# ---------------------------------------------------------------------------
[bootstrap.hooks.final]
run = [
  # Seed hand-authored per-machine files. `cp -n` declines when the target
  # exists, so these never clobber local edits.
  'cp -n ~/dotfiles/user.justfile.tmpl ~/.user.justfile 2>/dev/null || true',
  'cp -n ~/dotfiles/kopia/kopiaignore.local.tmpl ~/.kopiaignore.local 2>/dev/null || true',

  # kitty app icon.
  'test -f ~/.config/kitty/kitty.app.icns || curl -fsSL -o ~/.config/kitty/kitty.app.icns https://github.com/k0nserv/kitty-icon/raw/refs/heads/main/build/outrun.icns',

  # yabai and skhd install and manage their own launchd agents, so we call
  # their own service commands rather than declaring competing plists under
  # [bootstrap.macos.launchd.agents].
  'yabai --install-service 2>/dev/null || true',
  'skhd --install-service 2>/dev/null || true',
  'yabai --start-service 2>/dev/null || true',
  'skhd --start-service 2>/dev/null || true',
]

# ---------------------------------------------------------------------------
# macOS system preferences.
#
# These capture the values already set on this machine, read with
# `defaults read` before being written here -- applying them is a no-op on this
# machine and reproduces it on a new one. mise uses friendly names; the raw
# domain/key each one maps to is in the comment.
#
# Inspect with `mise bootstrap macos defaults status`, apply with `... apply`.
# Some changes need an app restart before they show up.
# ---------------------------------------------------------------------------
[bootstrap.macos.dock]
autohide    = true   # com.apple.dock.autohide
orientation = "left" # com.apple.dock.orientation

# Required for yabai: with this on, macOS reorders Spaces by most-recent-use
# and yabai's space indices move under you.
mru_spaces = false # com.apple.dock.mru-spaces

[bootstrap.macos.finder]
preferred_view_style = "list" # com.apple.finder.FXPreferredViewStyle (Nlsv)

[bootstrap.macos.keyboard]
press_and_hold           = false # NSGlobalDomain.ApplePressAndHoldEnabled
automatic_capitalization = true  # NSGlobalDomain.NSAutomaticCapitalizationEnabled

[bootstrap.macos.trackpad]
three_finger_drag = false # ...TrackpadThreeFingerDrag

# ---------------------------------------------------------------------------
# Raw defaults, for keys where the friendly sections cannot converge.
#
# These five were originally set by System Settings sliders/toggles, so cfprefsd
# stores them as plist `real` and `integer`. The friendly sections declare them
# as integer and boolean, so mise rewrites them on every apply and `status`
# reports `differs` forever. Declaring the raw types macOS actually keeps makes
# the config converge. Verified with `mise bootstrap macos defaults status`.
# ---------------------------------------------------------------------------
[bootstrap.macos.defaults."com.apple.dock"]
tilesize = 16.0

[bootstrap.macos.defaults."NSGlobalDomain"]
KeyRepeat        = 2.0
InitialKeyRepeat = 15.0

[bootstrap.macos.defaults."com.apple.AppleMultitouchTrackpad"]
Clicking = 0

[bootstrap.macos.defaults."com.apple.driver.AppleBluetoothMultitouch.trackpad"]
Clicking = 0
