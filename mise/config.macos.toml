# macOS-only bootstrap config.
#
# Loaded only when MISE_ENV includes "macos", which .miserc.toml sets from os().
# On Linux this file is never discovered, so nothing here exists there. That is
# a stronger guarantee than per-entry gating, and it replaces the
# `case "$(uname -s)"` block that install.sh used.

# ---------------------------------------------------------------------------
# macOS-only dotfiles. [dotfiles] merges with the base config's table.
# ---------------------------------------------------------------------------
[dotfiles]

# --- Homebrew prefix on PATH ----------------------------------------------
# mise installs brew formulae into /opt/homebrew without needing brew itself,
# but per the docs "linked commands need <prefix>/bin on PATH". Today that
# happens via a hand-written `brew shellenv` line in ~/.zprofile which (a) is
# not managed by this repo, so a fresh machine never gets it, and (b) requires
# the brew binary to exist. This entry removes both dependencies.
#
# macOS-only: the Linux prefix is /home/linuxbrew/.linuxbrew.
"~/.zshenv/homebrew-prefix" = { line = 'case ":$PATH:" in *":/opt/homebrew/bin:"*) ;; *) export PATH="/opt/homebrew/bin:/opt/homebrew/sbin:$PATH" ;; esac', position = "prepend" }

# --- window manager and hotkey daemon --------------------------------------
"~/.config/yabai/yabairc"           = "~/dotfiles/yabai/yabairc"
"~/.config/yabai/intellij_yabai.sh" = "~/dotfiles/yabai/intellij_yabai.sh"
"~/.config/skhd/skhdrc"             = "~/dotfiles/skhd/skhdrc"

# --- global justfiles ------------------------------------------------------
# ~/.user.justfile is NOT here: it is hand-authored, has diverged from the
# template, and user.justfile.tmpl contains `{{ justfile() }}`, which Tera
# would try to call as a nonexistent function. It is seeded in the hook below.
"~/.window.justfile" = "~/dotfiles/window.justfile"
"~/.k8s.justfile"    = "~/dotfiles/k8s.justfile"

# --- backup excludes -------------------------------------------------------
# ~/.kopiaignore.local is seeded in the hook below, not managed here: it is
# 2.5x the size of its template and is deliberately machine-private.
"~/.kopiaignore" = "~/dotfiles/kopia/kopiaignore"

# --- Cocoa key bindings ----------------------------------------------------
# Only apps using the standard Cocoa text system (NSTextView) honor this.
# kitty, terminal nvim, JetBrains (Swing) and Electron apps all ignore it, so
# it may be doing nothing in practice -- test in TextEdit before investing.
# Stays a dotfile entry: it is a plist at a fixed path, not a `defaults` domain.
"~/Library/KeyBindings/DefaultKeyBinding.dict" = "~/dotfiles/mac/DefaultKeyBinding.dict"

# ---------------------------------------------------------------------------
# Homebrew formulae and casks, installed by mise into the canonical Homebrew
# prefix (/opt/homebrew). mise does the same relocation, code-signing and
# linking work brew does, and maintains brew's own
# <prefix>/var/homebrew/linked/<name> records, so brew-installed and
# mise-installed formulae coexist in one prefix.
# ---------------------------------------------------------------------------
[bootstrap.brew]
# Take ownership of already-installed casks instead of replacing the bundle.
# Replacing a bundle can make macOS revoke its Privacy & Security grants.
adopt = true

[bootstrap.brew.taps]
# mise reads tap metadata directly from GitHub; it does not tap real Homebrew.
"asmvik/formulae"     = "https://github.com/asmvik/homebrew-formulae.git"
"felixkratz/formulae" = "https://github.com/felixkratz/homebrew-formulae.git"
"jannis-baum/tap"     = "https://github.com/jannis-baum/homebrew-tap.git"
"quarylabs/quary"     = "https://github.com/quarylabs/homebrew-quary.git"

[bootstrap.packages]
# A curated list. Do not regenerate with `mise bootstrap packages import` --
# it snapshots every installed top-level formula and emits zero casks.

